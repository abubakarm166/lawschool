{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pending Approval - Law School</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static '/files/css/style.css' %}">
</head>
<body>
  <div class="container-fluid header p-0 m-0">
    <nav class="navbar navbar-expand-lg p-0 m-0" style="background-color: transparent;">
      <div class="container-fluid p-0 m-0">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </nav>
  </div>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow text-center">
          <div class="card-body py-5">
            <div class="mb-4">
              <i class="bi bi-hourglass-split" style="font-size: 4rem; color: #ffc107;"></i>
            </div>
            <h3 class="card-title mb-3">Registration Pending Approval</h3>
            <p class="card-text text-muted mb-4">
              Your registration request has been submitted and is awaiting administrator approval.
              You will be able to access assignments once your request is approved.
            </p>
            <div class="d-grid gap-2 d-md-flex justify-content-md-center">
              <a href="{% url 'user_logout' %}" class="btn btn-outline-secondary">Logout</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</body>
</html>
